<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="preBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DED8CB"/>
      <stop offset="55%" stop-color="#A39B8C"/>
      <stop offset="100%" stop-color="#5C574C"/>
    </linearGradient>
    <filter id="softBlur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#preBg)"/>

  <!-- soft silhouette occupying one third of the frame, large negative space beside it -->
  <path d="M 620 260 Q 700 320 700 460 L 700 640 Q 760 700 760 820 L 760 1150 L 560 1150 L 560 820 Q 560 700 610 640 L 610 460 Q 610 340 620 260 Z"
        fill="#1A1917" opacity="0.30" filter="url(#softBlur2)"/>
  <ellipse cx="662" cy="210" rx="48" ry="58" fill="#1A1917" opacity="0.26" filter="url(#softBlur2)"/>

  <rect width="900" height="1200" filter="url(#grain4)" opacity="0.06"/>
</svg>
