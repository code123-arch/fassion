<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="tailBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4BEB1"/>
      <stop offset="50%" stop-color="#928A7C"/>
      <stop offset="100%" stop-color="#4E4A41"/>
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#tailBg)"/>

  <!-- stylized lapel / collar construction lines: line and proportion, no ornament -->
  <g fill="none" stroke="#F5F3EF" stroke-width="2.5" opacity="0.6" stroke-linecap="round">
    <path d="M 260 180 L 420 460 L 300 1040"/>
    <path d="M 640 160 L 470 460"/>
  </g>
  <g fill="none" stroke="#1A1917" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <path d="M 420 460 L 660 520"/>
    <line x1="300" y1="1040" x2="300" y2="1160"/>
  </g>
  <circle cx="420" cy="460" r="5" fill="#1A1917" opacity="0.4"/>

  <rect width="900" height="1200" filter="url(#grain3)" opacity="0.06"/>
</svg>
